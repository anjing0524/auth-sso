# ==============================================================================
# Auth-SSO 信创安全网关 Docker 环境配置
# ==============================================================================

[gateway]
port = 80
ssl_port = 443
# 未启用内建 ACME 时使用的显式证书路径；生产 Compose 启用 ACME 后忽略。
ssl_cert_path = "/etc/gateway/ssl/fullchain.pem"
ssl_key_path = "/etc/gateway/ssl/privkey.pem"
log_dir = "logs"
log_level = "info"
# H-D-10：/__gateway/metrics 的独立只读令牌（≥16 字符，建议 openssl rand -hex 32）。
# 不配置时回退 gateway_shared_secret；配置后抓取器凭证与 HMAC 签名密钥分离。
# 也可用环境变量 GATEWAY_METRICS_TOKEN 覆盖。
# metrics_token = ""

[gateway.oauth]
client_id = "portal"
client_secret = "请替换为 Portal seed 脚本输出的 client_secret 明文"

[redis]
url = "redis://redis:6379"

# ==============================================================================
# 多 Upstream 路由表 — name 即 path prefix，按长度降序最长匹配。
# ==============================================================================

[[upstreams]]
name = "/"
addresses = "portal:4000"
oidc_provider = true
public_paths = [
    "/login",
    "/register",
    "/error",
    "/oauth/error",
    "/api/auth/",
    "/oauth2/",
    "/.well-known/",
    "/",
    "/_next/",
    "/favicon.ico",
]

# 注意：demo-app 是示例应用，生产 compose **不包含** demo 服务。
# 此处不再声明 `/demo/` upstream（2026-10-23 修复）：旧配置指向不存在的 `demo:3000`，
# 任何 /demo/* 请求都会静默 502。需要演示/独立部署 demo 时，请自行添加服务并加回：
#   [[upstreams]]
#   name = "/demo/"
#   addresses = "demo:3000"
#   public_paths = ["/demo/landing"]
