name: Release Validation

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validation-suite.yml
    with:
      artifact_name: release-e2e-evidence
      artifact_retention_days: 30
      run_fault_injection: false
