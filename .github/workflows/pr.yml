name: PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validation-suite.yml
    with:
      artifact_name: gateway-e2e-pr
      artifact_retention_days: 14
      run_fault_injection: false
